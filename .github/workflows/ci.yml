name: RedBus BDD CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redbus-bdd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cucumber:
    name: Cucumber BDD (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Cucumber scenarios
        run: xvfb-run -a npm test
        env:
          CI: true
          BASE_URL: https://www.redbus.in
          HEADLESS: "false"

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d reports/allure-results ]; then
            npm run allure:generate
          fi

      - name: Upload Allure report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redbus-allure-and-diagnostics
          path: |
            reports/allure-results/
            reports/allure-report/
            screenshots/
            traces/
            videos/
          if-no-files-found: ignore
          retention-days: 14
